<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlit Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="library">
        <div class="row1">
            <h1>Moonlit Library</h1>
            <div class="row1-a">
                <button class="home yellow">Home</button>
                <button class="request">Request</button>
                <button class="logOut" id="logOut">Log out</button>
            </div>
        </div>
        <div class="row2">
            <input type="search" class="searchInput" placeholder="Search title, author or genre...">
            <button class="searchBtn">Search</button>
        </div>
        <div class="row3">
            <button class="genre pink">All</button>
            <button class="genre">Manga</button>
            <button class="genre">Fantasy</button>
            <button class="genre">Romance</button>
        </div>
        <div class="books" id="books">
        </div>
        <div class="row4">
            <p>My borrow requests</p>
            <div class="lists">
                <div class="borrowBook">
                    <p class="title">Title</p>
                    <button class="yellow">Waiting for admin</button>
                </div>
                <div class="borrowBook">
                    <p class="title">Title</p>
                    <button class="green">Approved, pick up</button>
                </div>
                <div class="borrowBook">
                    <p class="title">Title</p>
                    <button class="green">Approved, pick up</button>
                </div>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>

</html>
