<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonlit Library</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="library">
        <div class="row1">
            <h1>Moonlit Library</h1>
            <div class="row1-a">
                <button class="home yellow" id="navHome">Home</button>
                <button class="request" id="navReq">Request</button>
                <button class="logOut" id="logOut">Log out</button>
            </div>
        </div>
        <form class="row2" id="row2Form">
            <input type="search" class="searchInput" id="searchInput" name="searching"
                placeholder="Search title, author or genre...">
            <button type="submit" class="searchBtn" id="searchBtn">Search</button>
        </form>
        <div class="row3">
            <button class="genre" id="all">All</button>
            <button class="genre" onclick="searchBooks('Manga')">Manga</button>
            <button class="genre" onclick="searchBooks('Fantasy')">Fantasy</button>
            <button class="genre" onclick="searchBooks('Romance')">Romance</button>
        </div>
        <div class="books" id="books">
        </div>
        <div class="row4">
            <p>My borrow requests</p>
            <div class="lists" id="lists">
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>

</html>
